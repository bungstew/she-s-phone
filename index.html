<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 휴대폰</title>
  <style>
    body {
      margin: 0;
      background: #e9e1f5;
      font-family: sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .phone {
      width: 300px;
      height: 580px;
      max-width: 85vw;
      background: linear-gradient(145deg, #f5dcff, #d9e4ff);
      border: 8px solid #292633;
      border-radius: 36px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    h1 { margin-top: 65px; }
    .apps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px 8px;
      margin-top: 65px;
    }
    button {
      border: 0;
      background: white;
      border-radius: 16px;
      padding: 12px 4px;
      font-size: 24px;
      cursor: pointer;
    }
    p { font-size: 12px; }
  </style>
</head>
<body>
  <main class="phone">
    <p>9:41　●●●　 Wi-Fi</p>
    <h1 id="title">안녕!</h1>
    <p>나만의 휴대폰</p>
    <div class="apps">
      <button onclick="openApp('메시지')">💬<p>메시지</p></button>
      <button onclick="openApp('연락처')">👥<p>연락처</p></button>
      <button onclick="openApp('사진')">🖼️<p>사진</p></button>
      <button onclick="openApp('전화')">📞<p>전화</p></button>
      <button onclick="openApp('설정')">⚙️<p>설정</p></button>
      <button onclick="openApp('홈')">🏠<p>홈</p></button>
    </div>
  </main>
  <script>
    function openApp(name) {
      document.getElementById('title').textContent =
        name === '홈' ? '안녕!' : name;
    }
  </script>
</body>
</html>
