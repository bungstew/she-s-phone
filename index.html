<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>휴대폰 엿보기</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  color: white;
  background: #09090c;
}
button { font: inherit; cursor: pointer; }
.phone {
  min-height: 100dvh;
  padding: 22px 20px 105px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 30% 35%, #292a30 0%, transparent 50%),
    linear-gradient(145deg, #202126, #08080b 75%);
}
.status {
  display: flex;
  justify-content: space-between;
  padding: 6px 15px 22px;
  font-size: 15px;
}
.status span:last-child { letter-spacing: 2px; }
.back {
  border: 0;
  border-radius: 30px;
  color: #ddd;
  background: #48494f;
  padding: 7px 14px;
  margin-bottom: 18px;
  font-size: 13px;
}
.widget {
  width: 100%;
  min-height: 220px;
  border: 0;
  border-radius: 32px;
  padding: 24px;
  color: white;
  background: rgba(105,105,112,.55);
  display: flex;
  text-align: left;
  gap: 22px;
  align-items: center;
}
.date { min-width: 92px; }
.day { color: #ff777d; font-weight: bold; font-size: 15px; }
.bigday { font-size: 65px; font-weight: 300; line-height: 1.1; }
.month { font-size: 17px; }
.events { flex: 1; min-width: 0; }
.event {
  border-left: 5px solid #36c77c;
  padding-left: 10px;
  margin: 12px 0;
  font-size: 14px;
  color: #ddd;
}
.event.blue { border-color: #168bff; }
.event strong { display: block; font-size: 15px; color: white; }
.apps {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 30px 12px;
  margin: 40px 4px 0;
}
.app {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 0;
  padding: 0;
  color: white;
  background: transparent;
  min-width: 0;
}
.iconbox {
  width: min(100%, 88px);
  aspect-ratio: 1;
  border-radius: 23px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 43px;
  box-shadow: 0 3px 8px #0004;
  overflow: hidden;
}
.appname { font-size: 14px; }
.mail { background: linear-gradient(#299bff,#0871df); }
.calendar { background: #fff; color: #161616; }
.clock { background: #fff; color: #151515; }
.weather { background: linear-gradient(#4aa4fa,#67c7ed); }
.memo { background: linear-gradient(#ffdc55 0 30%,#fff 30%); color: #bbb; }
.photos { background: #fff; }
.camera { background: linear-gradient(135deg,#eee,#b8b8c0); }
.badge {
  position: absolute;
  top: -8px;
  right: -2px;
  background: #f33e42;
  color: white;
  border-radius: 50%;
  min-width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  font-size: 15px;
}
.search {
  display: block;
  margin:  auto auto 26px;
  transform: translateY(0);
  border: 0;
  border-radius: 30px;
  padding: 10px 20px;
  color: white;
  background: #343438;
  font-size: 14px;
}
.home-bottom {
  position: fixed;
  z-index: 5;
  bottom: 10px;
  left: 3%;
  width: 94%;
  min-height: 112px;
  border-radius: 45px;
  padding: 20px 16px;
  background: rgba(52,52,57,.88);
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 10px;
}
.home-bottom .iconbox {
  width: min(100%, 88px);
  border-radius: 22px;
}
.phoneicon { background: linear-gradient(#63ed67,#19bf40); }
.webicon { background: white; color: #1682dc; }
.chaticon { background: linear-gradient(#63ed67,#19bf40); }
.yellow { background: #ffe600; color: #261800; }
.screen { display: none; min-height: 75vh; }
.screen.active { display: block; }
.page-title {
  font-size: 30px;
  margin: 20px 0;
}
.panel {
  background: #24252b;
  border-radius: 20px;
  padding: 18px;
  margin: 14px 0;
}
.monthrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.monthrow button {
  background: #393a41;
  border: 0;
  border-radius: 12px;
  padding: 10px 15px;
  color: white;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7,1fr);
  gap: 5px;
  text-align: center;
}
.calendar-grid div {
  padding: 11px 0;
  font-size: 14px;
}
.calendar-grid .weekday { color: #aaa; }
.calendar-grid .today {
  border-radius: 50%;
  background: #168bff;
}
.listitem {
  border-bottom: 1px solid #44454b;
  padding: 15px 0;
}
.smallnote { color: #aaa; font-size: 13px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span id="time">11:59</span>
    <span>▮▮▮ ◉ ▰</span>
  </div>

  <main id="home" class="screen active">
    <button class="back" onclick="showHome()">〈 본문으로</button>

    <button class="widget" onclick="openApp('calendar')" aria-label="달력 열기">
      <div class="date">
        <div class="day" id="weekday">일요일</div>
        <div class="bigday" id="daynum">18</div>
        <div class="month" id="monthnum">10월</div>
      </div>
      <div class="events">
        <div class="event">
          <strong>데이트</strong>
          <span id="dateEvent">10/18 (일) 12:00</span>
        </div>
        <div class="event blue">
          <strong>의뢰인 미팅 - 대성물산 법무팀</strong>
          <span>10/19 (월) 10:00 · 사무실 3층 회의실</span>
        </div>
      </div>
    </button>

    <div class="apps">
      <button class="app" onclick="openApp('mail')">
        <span class="iconbox mail">✉</span>
        <span class="appname">메일</span>
        <span class="badge">2</span>
      </button>
      <button class="app" onclick="openApp('calendar')">
        <span class="iconbox calendar" style="flex-direction:column">
          <small style="color:#e35d65;font-size:12px">일요일</small>
          <span style="font-size:38px" id="calIconDay">18</span>
        </span>
        <span class="appname">캘린더</span>
      </button>
      <button class="app" onclick="openApp('clock')">
        <span class="iconbox clock">🕒</span>
        <span class="appname">시계</span>
      </button>
      <button class="app" onclick="openApp('weather')">
        <span class="iconbox weather">🌤️</span>
        <span class="appname">날씨</span>
      </button>
      <button class="app" onclick="openApp('memo')">
        <span class="iconbox memo">▤</span>
        <span class="appname">메모</span>
      </button>
      <button class="app" onclick="openApp('photos')">
        <span class="iconbox photos">🏞️</span>
        <span class="appname">사진</span>
      </button>
      <button class="app" onclick="openApp('camera')">
        <span class="iconbox camera">📷</span>
        <span class="appname">카메라</span>
      </button>
    </div>

    <div style="height: min(48vh, 430px); display:flex;align-items:flex-end;justify-content:center">
      <button class="search" onclick="openApp('search')">⌕ 검색</button>
    </div>
  </main>

  <main id="detail" class="screen">
    <button class="back" onclick="showHome()">〈 홈 화면</button>
    <h1 class="page-title" id="pageTitle">캘린더</h1>
    <div id="pageContent"></div>
  </main>
</div>

<nav class="home-bottom">
  <button class="app" onclick="openApp('phone')">
    <span class="iconbox phoneicon">☎</span>
    <span class="badge">8</span>
  </button>
  <button class="app" onclick="openApp('internet')">
    <span class="iconbox webicon">🌐</span>
  </button>
  <button class="app" onclick="openApp('messages')">
    <span class="iconbox chaticon">●</span>
    <span class="badge">3</span>
  </button>
  <button class="app" onclick="openApp('chat')">
    <span class="iconbox yellow">•••</span>
    <span class="badge">12</span>
  </button>
</nav>

<script>
const titles = {
  calendar:'캘린더', mail:'메일', clock:'시계', weather:'날씨',
  memo:'메모', photos:'사진', camera:'카메라',
  phone:'전화', internet:'인터넷', messages:'메시지',
  chat:'채팅', search:'검색'
};

function showHome() {
  document.getElementById('home').classList.add('active');
  document.getElementById('detail').classList.remove('active');
}

function openApp(app) {
  document.getElementById('home').classList.remove('active');
  document.getElementById('detail').classList.add('active');
  document.getElementById('pageTitle').textContent = titles[app] || app;

  const content = document.getElementById('pageContent');

  if (app === 'calendar') {
    content.innerHTML = `
      <div class="panel">
        <div class="monthrow">
          <button onclick="changeMonth(-1)">〈</button>
          <strong id="monthHeading"></strong>
          <button onclick="changeMonth(1)">〉</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
      <div class="panel">
        <strong>예정된 일정</strong>
        <div class="listitem">🟢 데이트 <div class="smallnote">12:00</div></div>
        <div class="listitem">🔵 의뢰인 미팅 - 대성물산 법무팀
          <div class="smallnote">10/19 10:00 · 사무실 3층 회의실</div>
        </div>
        <button class="back" onclick="addEvent()">＋ 일정 추가</button>
        <div id="newEvent"></div>
      </div>`;
    renderCalendar();
  } else if (app === 'mail') {
    content.innerHTML = `<div class="panel">
      <div class="listitem">📩 확인하지 않은 메일 (2)</div>
      <div class="listitem">업무 관련 안내 <div class="smallnote">오늘 10:30</div></div>
      <div class="listitem">새로운 메일이 도착했습니다. <div class="smallnote">어제</div></div>
    </div>`;
  } else if (app === 'memo') {
    content.innerHTML = `<div class="panel">
      <textarea id="memoText" placeholder="메모를 입력하세요..." style="width:100%;min-height:180px;background:#303138;color:white;border:0;padding:12px;border-radius:12px"></textarea>
      <p class="smallnote">이 메모는 현재 화면에서 작성하는 예시입니다.</p>
    </div>`;
  } else if (app === 'clock') {
    content.innerHTML = `<div class="panel" style="text-align:center;padding:50px 10px">
      <div style="font-size:45px" id="liveClock">12:00:00</div>
      <p>시계</p>
    </div>`;
    updateClock();
  } else if (app === 'weather') {
    content.innerHTML = `<div class="panel" style="text-align:center;padding:40px">
      <div style="font-size:65px">🌤️</div><h2>날씨</h2>
      <p>날씨 정보 화면</p><div class="smallnote">실시간 날씨는 연결되어 있지 않습니다.</div>
    </div>`;
  } else if (app === 'photos') {
    content.innerHTML = `<div class="panel">사진이 아직 없습니다.</div>`;
  } else if (app === 'camera') {
    content.innerHTML = `<div class="panel">카메라 앱 화면</div>`;
  } else if (app === 'phone') {
    content.innerHTML = `<div class="panel">최근 통화<div class="listitem">연락처</div><div class="listitem">통화 기록</div></div>`;
  } else if (app === 'internet') {
    content.innerHTML = `<div class="panel"><input id="webAddress" placeholder="검색어 또는 주소" style="width:100%;padding:14px;border-radius:12px;border:0"><button class="back" onclick="fakeSearch()">검색</button><div id="webResult"></div></div>`;
  } else if (app === 'messages' || app === 'chat') {
    content.innerHTML = `<div class="panel"><div class="listitem">대화 목록</div><input id="chatInput" placeholder="메시지 입력..." style="width:100%;padding:12px;border-radius:12px;border:0"><button class="back" onclick="sendMessage()">보내기</button><div id="chatResult"></div><p class="smallnote">화면을 보여주기 위한 모의 채팅입니다.</p></div>`;
  } else {
    content.innerHTML = `<div class="panel"><input placeholder="검색어를 입력하세요" style="width:100%;padding:12px;border-radius:12px;border:0"></div>`;
  }
}

let viewYear = 2026;
let viewMonth = 9;

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  if (!grid) return;
  const heading = document.getElementById('monthHeading');
  heading.textContent = `${viewYear}년 ${viewMonth + 1}월`;
  grid.innerHTML = '';
  ['일','월','화','수','목','금','토'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'weekday';
    el.textContent = d;
    grid.appendChild(el);
  });
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const total = new Date(viewYear, viewMonth + 1, 0).getDate();
  for (let i = 0; i < firstDay; i++) {
    grid.appendChild(document.createElement('div'));
  }
  for (let day = 1; day <= total; day++) {
    const el = document.createElement('div');
    el.textContent = day;
    if (day === 18 && viewMonth === 9 && viewYear === 2026) el.className = 'today';
    el.onclick = () => {
      document.querySelectorAll('.calendar-grid .today').forEach(n => n.classList.remove('today'));
      el.classList.add('today');
    };
    grid.appendChild(el);
  }
}

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
}

function addEvent() {
  const name = prompt('추가할 일정 이름을 입력하세요.');
  if (name) document.getElementById('newEvent').textContent = '🟢 ' + name;
}

function fakeSearch() {
  const value = document.getElementById('webAddress').value;
  document.getElementById('webResult').textContent = value ? '검색 화면: ' + value : '검색어를 입력하세요.';
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  if (!input.value.trim()) return;
  document.getElementById('chatResult').textContent = '나: ' + input.value;
  input.value = '';
}

function updateClock() {
  const el = document.getElementById('liveClock');
  if (el) el.textContent = new Date().toLocaleTimeString('ko-KR', {hour12:false});
}

function updateDate() {
  const now = new Date();
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('time').textContent =
    now.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('weekday').textContent = days[now.getDay()];
  document.getElementById('daynum').textContent = now.getDate();
  document.getElementById('monthnum').textContent = (now.getMonth()+1) + '월';
  document.getElementById('calIconDay').textContent = now.getDate();
  document.getElementById('dateEvent').textContent =
    `${now.getMonth()+1}/${now.getDate()} (${['일','월','화','수','목','금','토'][now.getDay()]}) 12:00`;
}
updateDate();
setInterval(updateDate, 30000);
setInterval(updateClock, 1000);
</script>
</body>
</html>
